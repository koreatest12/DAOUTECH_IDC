<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IDC 상면 관제 콘솔</title>
<style>
:root{
  --cold:#EDF0F2;        /* 콜드아일 회백 */
  --panel:#FFFFFF;
  --rail:#D3DAE0;        /* 랙 레일 */
  --steel:#2B3A47;       /* 장비 전면 패널 */
  --ink:#16212B;
  --ink-soft:#5D6E7C;
  --link:#1F6FB2;        /* UP / 링크 */
  --warn:#B87309;
  --alarm:#B3352B;
  --ok:#2C7A52;
  --idle:#97A6B2;
  --sans:'Barlow Semi Condensed','Malgun Gothic','Apple SD Gothic Neo',sans-serif;
  --body:'Pretendard','Malgun Gothic','Apple SD Gothic Neo',system-ui,sans-serif;
  --num:'IBM Plex Mono','D2Coding',ui-monospace,Consolas,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--cold);color:var(--ink);font-family:var(--body);font-size:14px}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
:focus-visible{outline:2px solid var(--link);outline-offset:2px}

/* 헤더 — 랙 상단 명판 */
.bar{background:var(--steel);color:#DCE4EA;display:flex;align-items:center;gap:18px;padding:0 20px;height:56px}
.bar h1{font-family:var(--sans);font-size:22px;font-weight:600;letter-spacing:.4px}
.bar .site{border-left:1px solid #46586A;padding-left:18px;font-size:13px;color:#9DB0C0}
.bar .grow{flex:1}
.clock{font-family:var(--num);font-size:13px;color:#B9CAD8}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 rgba(44,122,82,.6);animation:beat 2.4s infinite}
@keyframes beat{70%{box-shadow:0 0 0 7px rgba(44,122,82,0)}100%{box-shadow:0 0 0 0 rgba(44,122,82,0)}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}}

.wrap{display:grid;grid-template-columns:1fr 320px;gap:16px;padding:16px;align-items:start}
@media(max-width:1020px){.wrap{grid-template-columns:1fr}}

/* 요약 스트립 */
.strip{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--rail);border:1px solid var(--rail);margin-bottom:16px}
.strip div{background:var(--panel);padding:12px 14px}
.strip .v{font-family:var(--num);font-size:26px;line-height:1.1}
.strip .k{font-size:12px;color:var(--ink-soft);margin-top:3px}
.strip .v.warn{color:var(--warn)} .strip .v.alarm{color:var(--alarm)} .strip .v.ok{color:var(--ok)}

.card{background:var(--panel);border:1px solid var(--rail)}
.card h2{font-family:var(--sans);font-size:17px;font-weight:600;padding:11px 14px;border-bottom:1px solid var(--rail);display:flex;align-items:center;gap:10px}
.card h2 .cnt{font-family:var(--num);font-size:12px;color:var(--ink-soft);font-weight:400}

/* 랙 지도 */
.racks{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px;padding:14px}
.rack{border:1px solid var(--rail);background:#F7F9FA}
.rack .rh{display:flex;justify-content:space-between;align-items:baseline;padding:6px 8px;background:var(--steel);color:#CFDAE3;font-family:var(--num);font-size:11px}
.rack .ru{display:flex;flex-direction:column;gap:2px;padding:6px}
.u{display:flex;align-items:center;gap:6px;padding:3px 5px;border-left:3px solid var(--idle);background:#fff;cursor:pointer;font-size:12px}
.u:hover{background:#EEF4F8}
.u.up{border-left-color:var(--ok)} .u.warn{border-left-color:var(--warn);background:#FDF6EA}
.u.crit{border-left-color:var(--alarm);background:#FBEDEB} .u.down{border-left-color:var(--idle);opacity:.62}
.u .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.u .ld{font-family:var(--num);font-size:11px;color:var(--ink-soft)}
.rack .env{display:flex;justify-content:space-between;padding:5px 8px;border-top:1px solid var(--rail);font-family:var(--num);font-size:11px;color:var(--ink-soft)}
.env b{font-weight:500;color:var(--ink)} .env .hot{color:var(--alarm)}

/* 경보 */
.feed{max-height:420px;overflow:auto}
.al{display:grid;grid-template-columns:56px 1fr;gap:8px;padding:9px 12px;border-bottom:1px solid #EAEEF1}
.al time{font-family:var(--num);font-size:11px;color:var(--ink-soft)}
.al .m{font-size:12.5px;line-height:1.45}
.al .sev{display:inline-block;font-size:11px;padding:0 5px;border:1px solid;margin-right:5px;vertical-align:1px}
.sev.c{color:var(--alarm);border-color:var(--alarm)} .sev.w{color:var(--warn);border-color:var(--warn)}
.sev.i{color:var(--link);border-color:var(--link)} .sev.r{color:var(--ok);border-color:var(--ok)}

/* 드로어 */
.scrim{position:fixed;inset:0;background:rgba(22,33,43,.42);opacity:0;pointer-events:none;transition:opacity .18s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--panel);border-left:1px solid var(--rail);
  transform:translateX(100%);transition:transform .22s ease;display:flex;flex-direction:column;z-index:20}
.drawer.on{transform:none}
@media (prefers-reduced-motion:reduce){.drawer,.scrim{transition:none}}
.dh{background:var(--steel);color:#E2EAF0;padding:13px 16px;display:flex;align-items:center;gap:12px}
.dh h3{font-family:var(--sans);font-size:20px;font-weight:600;flex:1}
.dh button{font-size:22px;line-height:1;color:#9DB0C0}
.db{overflow:auto;padding:16px;display:flex;flex-direction:column;gap:16px}
.res{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.res div{border:1px solid var(--rail);padding:9px 10px}
.res .n{font-family:var(--num);font-size:21px}
.res .l{font-size:11.5px;color:var(--ink-soft)}
.gauge{height:5px;background:#E7ECEF;margin-top:7px}
.gauge i{display:block;height:100%;background:var(--ok)}
.gauge i.w{background:var(--warn)} .gauge i.c{background:var(--alarm)}
.meta{display:grid;grid-template-columns:repeat(2,1fr);gap:0 14px;font-size:12.5px}
.meta p{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dotted #DCE2E7}
.meta span{color:var(--ink-soft)} .meta b{font-weight:500;font-family:var(--num);font-size:12px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font-weight:600;padding:7px 8px;border-bottom:1px solid var(--rail);background:#F5F8F9;font-size:12px}
td{padding:6px 8px;border-bottom:1px solid #EDF1F3}
td.n{font-family:var(--num);font-size:12px;text-align:right}
.st{font-size:11px;padding:1px 6px;border:1px solid}
.st.up{color:var(--ok);border-color:var(--ok)} .st.dn{color:var(--alarm);border-color:var(--alarm)}
.st.ad{color:var(--idle);border-color:var(--idle)}
.tg{border:1px solid var(--rail);padding:2px 9px;font-size:12px}
.tg:hover{background:#EEF4F8}
.err{color:var(--alarm)}
.hint{font-size:12px;color:var(--ink-soft);padding:10px 14px;border-top:1px solid var(--rail);line-height:1.6}
</style>
</head>
<body>

<div class="bar">
  <h1>IDC 상면 관제 콘솔</h1>
  <div class="site">A동 2층 · 4개 랙 · 13대</div>
  <div class="grow"></div>
  <div class="pulse" aria-hidden="true"></div>
  <div class="clock" id="clk">--:--:--</div>
</div>

<div class="wrap">
  <div>
    <div class="strip">
      <div><div class="v" id="s-tot">0</div><div class="k">감시 대상</div></div>
      <div><div class="v ok" id="s-up">0</div><div class="k">정상</div></div>
      <div><div class="v warn" id="s-wn">0</div><div class="k">주의</div></div>
      <div><div class="v alarm" id="s-cr">0</div><div class="k">조치 필요</div></div>
    </div>

    <div class="card">
      <h2>랙 배치도 <span class="cnt" id="rk-cnt"></span></h2>
      <div class="racks" id="racks"></div>
      <p class="hint">장비를 누르면 자원 사용률과 포트별 상태를 볼 수 있습니다. 랙 하단은 흡기 온도와 랙 전력이며, 설계 한계는 랙당 6kW입니다.</p>
    </div>
  </div>

  <div class="card">
    <h2>경보 <span class="cnt" id="al-cnt"></span></h2>
    <div class="feed" id="feed"></div>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="d-name">
  <div class="dh"><h3 id="d-name">장비</h3><button id="d-close" aria-label="닫기">×</button></div>
  <div class="db" id="d-body"></div>
</aside>

const LBL = {up:'정상',warn:'주의',crit:'조치 필요',down:'정지'};
const SEV = {c:'CRIT',w:'WARN',i:'INFO',r:'복구'};

/* ── 렌더 ──────────────────────────────────── */
const $ = s => document.querySelector(s);
const all = () => RACKS.flatMap(r => r.devs);

function drawRacks(){
  $('#racks').innerHTML = RACKS.map(r => `
    <div class="rack">
      <div class="rh"><b>${r.id}</b><span>${r.pdu}</span></div>
      <div class="ru">
        ${r.devs.map(d => `<button class="u ${d.st}" data-dev="${d.n}">
            <span class="nm">${d.n}</span><span class="ld">${d.u}</span>
          </button>`).join('')}
      </div>
      <div class="env">
        <span>흡기 <b class="${r.tmp>27?'hot':''}">${r.tmp.toFixed(1)}°C</b></span>
        <span>전력 <b class="${r.kw>6?'hot':''}">${r.kw.toFixed(1)}kW</b></span>
      </div>
    </div>`).join('');
  $('#rk-cnt').textContent = RACKS.length + '개 랙 / ' + all().length + '대';
}

function drawSummary(){
  const d = all();
  $('#s-tot').textContent = d.length;
  $('#s-up').textContent  = d.filter(x=>x.st==='up').length;
  $('#s-wn').textContent  = d.filter(x=>x.st==='warn').length;
  $('#s-cr').textContent  = d.filter(x=>x.st==='crit'||x.st==='down').length;
}

function drawFeed(){
  $('#feed').innerHTML = ALERTS.map(a => `
    <div class="al"><time>${a.t}</time>
      <div class="m"><span class="sev ${a.s}">${SEV[a.s]}</span>${a.m}</div>
    </div>`).join('');
  $('#al-cnt').textContent = ALERTS.length + '건 · 최근 6시간';
}

function lvl(v){ return v>=80?'c' : v>=70?'w' : ''; }

function openDev(name){
  const d = all().find(x=>x.n===name); if(!d) return;
  const rack = RACKS.find(r => r.devs.includes(d));
  $('#d-name').textContent = d.n;
  $('#d-body').innerHTML = `
    <div class="res">
      <div><div class="n">${d.cpu}%</div><div class="l">CPU</div>
        <div class="gauge"><i class="${lvl(d.cpu)}" style="width:${d.cpu}%"></i></div></div>
      <div><div class="n">${d.mem}%</div><div class="l">메모리</div>
        <div class="gauge"><i class="${lvl(d.mem)}" style="width:${d.mem}%"></i></div></div>
      <div><div class="n">${d.tmp}°C</div><div class="l">흡기 온도</div>
        <div class="gauge"><i class="${d.tmp>=50?'c':d.tmp>=45?'w':''}" style="width:${Math.min(d.tmp,70)/70*100}%"></i></div></div>
    </div>
    <div class="meta">
      <p><span>상태</span><b>${LBL[d.st]}</b></p>
      <p><span>랙 · 위치</span><b>${rack.id} ${d.u}</b></p>
      <p><span>모델</span><b>${d.model}</b></p>
      <p><span>펌웨어</span><b>${d.fw}</b></p>
      <p><span>전원</span><b>${rack.pdu}</b></p>
      <p><span>랙 흡기</span><b>${rack.tmp.toFixed(1)}°C</b></p>
    </div>
    <div>
      <table>
        <thead><tr><th>포트</th><th>상태</th><th class="n">속도</th><th>할당</th>
          <th class="n">RX</th><th class="n">TX</th><th class="n">에러</th><th></th></tr></thead>
        <tbody>${d.ifs.map((f,i)=>ifRow(d.n,f,i)).join('')}</tbody>
      </table>
    </div>`;
  $('#scrim').classList.add('on'); $('#drawer').classList.add('on');
  $('#d-close').focus();
}

function mbps(v){ return v>=1000 ? (v/1000).toFixed(1)+' G' : v+' M'; }

function ifRow(dev,f,i){
  const cls = f.s==='up'?'up':f.s==='down'?'dn':'ad';
  const txt = f.s==='up'?'UP':f.s==='down'?'DOWN':'ADMIN-DN';
  return `<tr>
    <td>${f.p}</td><td><span class="st ${cls}">${txt}</span></td><td class="n">${f.sp}</td>
    <td>${f.v}</td><td class="n">${mbps(f.rx)}</td><td class="n">${mbps(f.tx)}</td>
    <td class="n ${f.e>0?'err':''}">${f.e}</td>
    <td><button class="tg" data-dev="${dev}" data-if="${i}">${f.s==='up'?'차단':'해제'}</button></td>
  </tr>`;
}

function toggleIf(dev,idx){
  const d = all().find(x=>x.n===dev); const f = d.ifs[idx];
  if(f.s==='up'){ f.prev=[f.rx,f.tx]; f.s='admin'; f.rx=0; f.tx=0; }
  else { f.s='up'; if(f.prev){ f.rx=f.prev[0]; f.tx=f.prev[1]; } }
  openDev(dev);
}

function close(){ $('#scrim').classList.remove('on'); $('#drawer').classList.remove('on'); }

/* ── 이벤트 ────────────────────────────────── */
document.addEventListener('click', e => {
  const u = e.target.closest('.u');       if(u){ openDev(u.dataset.dev); return; }
  const t = e.target.closest('.tg');      if(t){ toggleIf(t.dataset.dev, +t.dataset.if); return; }
  if(e.target.closest('#d-close') || e.target.id==='scrim') close();
});
document.addEventListener('keydown', e => { if(e.key==='Escape') close(); });

function tick(){
  $('#clk').textContent = new Date().toLocaleTimeString('ko-KR',{hour12:false});
}
tick(); setInterval(tick,1000);
drawRacks(); drawSummary(); drawFeed();
})();
</script>
</body>
</html>

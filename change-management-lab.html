<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>변경관리·Rollback 시뮬레이터</title><style>body{font-family:system-ui;margin:0;background:#0e1525;color:#eef3fb}.wrap{max-width:1050px;margin:auto;padding:24px}h1{margin-bottom:8px}.muted{color:#9eacc3}.card{background:#151f33;border:1px solid #2b3954;border-radius:14px;padding:16px;margin:14px 0}.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.step{padding:12px;background:#10192a;border:1px solid #283750;border-radius:10px}.step.done{border-color:#3f8b63}.step.fail{border-color:#a94f5c}button,select{background:#1b2941;color:white;border:1px solid #3a4d6d;border-radius:8px;padding:9px 12px;margin-right:7px}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #293852;text-align:left}.ok{color:#69dc99}.bad{color:#ff7d88}.warn{color:#ffd66b}</style></head><body><div class="wrap"><h1>변경관리·Rollback 시뮬레이터</h1><p class="muted">변경 요청 → 영향도 분석 → 사전 점검 → 작업 → 사후 검증 → Rollback 판단을 연습합니다.</p><div class="card"><select id="type"><option value="patch">서버 패치</option><option value="firewall">방화벽 정책</option><option value="service">서비스 설정 변경</option><option value="storage">스토리지 증설</option></select><select id="risk"><option value="low">저위험</option><option value="medium">중위험</option><option value="high">고위험</option></select><button onclick="prepare()">변경 계획 생성</button><button onclick="execute(false)">정상 수행</button><button onclick="execute(true)">장애 주입</button><button onclick="rollback()">Rollback</button></div><div class="card"><h2>절차</h2><div id="steps" class="steps"></div></div><div class="card"><h2>판정</h2><div id="result" class="muted">변경 계획을 생성하십시오.</div></div><div class="card"><h2>작업 기록</h2><table><thead><tr><th>단계</th><th>상태</th><th>기록</th></tr></thead><tbody id="log"></tbody></table></div></div><script>
const templates={patch:['영향도 확인','백업/스냅샷','사전 Health Check','패치 적용','서비스 확인','사후 Health Check'],firewall:['요청 목적 확인','Source/Destination 최소화','정책 백업','정책 적용','통신 테스트','불필요 허용 여부 재검토'],service:['설정 백업','변경 영향 분석','문법 검사','설정 적용','서비스 확인','로그 검증'],storage:['사용률 추세 확인','증설 대상 확인','작업 전 백업','용량 확장','파일시스템 확장','사용률/IO 확인']};let state=[];let rolled=false;function prepare(){const t=document.getElementById('type').value;state=templates[t].map((name,i)=>({name,status:i<3?'READY':'WAIT',note:i<3?'사전 준비 항목':'작업 대기'}));rolled=false;render();document.getElementById('result').innerHTML='<span class="warn">계획 생성 완료.</span> 사전 준비 항목 확인 후 작업을 수행하십시오.';}function execute(fail){if(!state.length)prepare();state=state.map((s,i)=>({...s,status:fail&&i===4?'FAIL':'DONE',note:fail&&i===4?'사후 검증 실패 — Rollback 필요':'정상 완료'}));render();document.getElementById('result').innerHTML=fail?'<span class="bad"><b>변경 실패.</b></span> 서비스 영향 확대 전 Rollback을 수행해야 합니다.':'<span class="ok"><b>변경 성공.</b></span> 사후 검증까지 완료되어 종료 가능합니다.';}function rollback(){if(!state.length)return;rolled=true;state.push({name:'Rollback',status:'DONE',note:'백업/이전 설정으로 복구 후 재검증'});render();document.getElementById('result').innerHTML='<span class="ok"><b>Rollback 완료.</b></span> 원인 분석 후 재작업 여부를 판단하십시오.';}function render(){const root=document.getElementById('steps'),log=document.getElementById('log');root.innerHTML='';log.innerHTML='';state.forEach(s=>{const d=document.createElement('div');d.className='step '+(s.status==='DONE'?'done':s.status==='FAIL'?'fail':'');d.innerHTML=`<b>${s.name}</b><br><span class="muted">${s.status}</span>`;root.appendChild(d);const tr=document.createElement('tr');tr.innerHTML=`<td>${s.name}</td><td class="${s.status==='FAIL'?'bad':s.status==='DONE'?'ok':'warn'}">${s.status}</td><td>${s.note}</td>`;log.appendChild(tr);});}
prepare();
</script></body></html>

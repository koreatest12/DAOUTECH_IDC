name: 포트폴리오 교차환경 단위 테스트

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        python: [ '3.12', '3.13', '3.14' ]

    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v7

      - name: Python 준비
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: 런타임 확인
        run: python --version

      - name: Python 전체 compile 검사
        run: python -m compileall -q .

      - name: unittest 실행
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests -p 'test_*.py' -v 2>&1 | tee unit-test-results.txt

      - name: 시나리오 회귀 검증
        shell: bash
        run: |
          set -o pipefail
          python scenario_runner.py scenarios --report scenario-test.md --json-report scenario-test.json 2>&1 | tee scenario-test.txt

      - name: Python 서버 업그레이드 strict precheck
        shell: bash
        run: |
          set -o pipefail
          python python_server_upgrade.py \
            --target "${{ matrix.python }}" \
            --target-executable python \
            --strict-target-installed \
            --report python-upgrade-test.md \
            --json-report python-upgrade-test.json 2>&1 | tee python-upgrade-test.txt

      - name: 결과 요약
        if: always()
        shell: bash
        run: |
          {
            echo '# 포트폴리오 교차환경 테스트'
            echo ''
            echo '- OS: **${{ matrix.os }}**'
            echo '- Python: **${{ matrix.python }}**'
            echo ''
            echo '```text'
            tail -n 35 unit-test-results.txt 2>/dev/null || true
            tail -n 10 scenario-test.txt 2>/dev/null || true
            tail -n 10 python-upgrade-test.txt 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 테스트 결과 보관
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tests-${{ matrix.os }}-py${{ matrix.python }}-${{ github.run_number }}
          path: |
            unit-test-results.txt
            scenario-test.txt
            scenario-test.md
            scenario-test.json
            python-upgrade-test.txt
            python-upgrade-test.md
            python-upgrade-test.json
          retention-days: 14
          if-no-files-found: warn

name: 저장소 파일 실행

# 저장소의 실행 가능한 Python 도구와 HTML 시뮬레이터를
# GitHub Actions에서 직접 선택하여 수행합니다.
# functional 모드에서도 운영 시스템을 변경하지 않습니다.

on:
  workflow_dispatch:
    inputs:
      target:
        description: 실행할 대상
        required: true
        default: all
        type: choice
        options:
          - all
          - python
          - html
          - healthcheck.py
          - log_analyzer.py
          - disk_forecast.py
          - svc_watchdog.py
          - backup_verify.py
          - cert_expiry.py
          - incident_report.py
          - alert_correlator.py
          - capacity_planner.py
          - sla_calculator.py
          - index.html
          - noc-dashboard.html
          - batch-operations-lab.html
          - incident-lab.html
          - change-management-lab.html
          - linux-security-lab.html
          - backup-simulator.html
          - server-console.html
          - network-path.html
      mode:
        description: 실행 수준
        required: true
        default: functional
        type: choice
        options:
          - functional
          - smoke

permissions:
  contents: read

jobs:
  execute:
    name: ${{ inputs.target }} · ${{ inputs.mode }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v7

      - name: Python 3.12 준비
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Node 24 준비
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: 런타임 및 실행 대상 확인
        run: |
          set -euo pipefail
          python3 --version
          node --version
          python3 tools/execute_repo.py --list

      - name: 실행 전 저장소 품질 확인
        run: |
          set -euo pipefail
          python3 tools/review_repo.py --report pre-run-review.md --json-report pre-run-review.json

      - name: 선택 대상 실제 수행
        id: execute
        env:
          RUN_TARGET: ${{ inputs.target }}
          RUN_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          python3 tools/execute_repo.py \
            --target "$RUN_TARGET" \
            --mode "$RUN_MODE" \
            --report run-results.md \
            --json-report run-results.json \
            --log-dir execution-logs

      - name: 실행 결과 요약
        if: always()
        env:
          RUN_TARGET: ${{ inputs.target }}
          RUN_MODE: ${{ inputs.mode }}
        run: |
          {
            echo "# DAOUTECH_IDC 저장소 파일 실행"
            echo ""
            echo "- 대상: **${RUN_TARGET}**"
            echo "- 모드: **${RUN_MODE}**"
            echo "- 실행 단계: **${{ steps.execute.outcome }}**"
            echo ""
            if [ -s run-results.md ]; then cat run-results.md; else echo "> 실행 결과 파일이 없습니다."; fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 실행 결과 보관
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: repository-execution-${{ github.run_number }}-${{ inputs.target }}
          path: |
            run-results.md
            run-results.json
            execution-logs/
            pre-run-review.md
            pre-run-review.json
          retention-days: 14
          if-no-files-found: warn

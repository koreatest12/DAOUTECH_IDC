name: 저장소 제출 검수 및 결정적 요약

# 저장소의 사실 판정과 제출 준비도는 외부 AI 없이 Python 검사기가 결정적으로 수행합니다.
# GitHub Models는 2026-07-30 종료되었으므로 actions/ai-inference를 사용하지 않습니다.
# Dependabot PR에서도 동일한 검사가 실행되며, 매주 정기 검수도 수행합니다.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # 매주 월요일 09:30 KST (00:30 UTC)
    - cron: '30 0 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-review:
    name: 전체 파일 검수·실행 분석·제출 판정
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v6

      - name: Python 3.12 준비
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Node 24 준비
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: 런타임 버전 확인
        run: |
          set -euo pipefail
          python3 --version
          node --version

      - name: 결정적 저장소 품질 검수
        id: review
        continue-on-error: true
        run: |
          python3 tools/review_repo.py \
            --report review.md \
            --json-report review.json

      - name: 전체 파일 안전 실행 및 제출 준비도 분석
        id: execution
        continue-on-error: true
        run: |
          python3 tools/run_analyze.py \
            --manifest portfolio-manifest.json \
            --report execution-report.md \
            --json-report execution-report.json

      - name: 실행 가능한 전체 파일 functional 수행
        id: functional
        continue-on-error: true
        run: |
          python3 tools/execute_repo.py \
            --target all \
            --mode functional \
            --report functional-run.md \
            --json-report functional-run.json \
            --log-dir functional-logs

      - name: 리포트 존재 보장
        if: always()
        shell: bash
        run: |
          if [ ! -s review.md ]; then
            {
              echo "# 저장소 자동 검수 리포트"
              echo ""
              echo "> tools/review_repo.py 실행 중 리포트 생성 자체가 실패했습니다."
            } > review.md
          fi
          if [ ! -s review.json ]; then
            printf '%s\n' '{"files": [], "issues": [{"severity": "ERROR", "path": "tools/review_repo.py", "message": "JSON 리포트 미생성", "action": "검수 단계 로그 확인"}]}' > review.json
          fi
          if [ ! -s execution-report.md ]; then
            {
              echo "# 제출 실행·분석 리포트"
              echo ""
              echo "> tools/run_analyze.py 실행 중 리포트 생성 자체가 실패했습니다."
            } > execution-report.md
          fi
          if [ ! -s execution-report.json ]; then
            printf '%s\n' '{"files": [], "submission_checks": [{"status": "ERROR", "item": "tools/run_analyze.py", "message": "JSON 리포트 미생성"}]}' > execution-report.json
          fi
          if [ ! -s functional-run.md ]; then
            {
              echo "# 저장소 functional 실행 결과"
              echo ""
              echo "> tools/execute_repo.py 실행 중 결과 리포트 생성 자체가 실패했습니다."
            } > functional-run.md
          fi
          if [ ! -s functional-run.json ]; then
            printf '%s\n' '{"status":"FAIL","records":[],"message":"functional 실행 JSON 리포트 미생성"}' > functional-run.json
          fi

      - name: 로컬 결정적 요약 생성
        id: summary
        continue-on-error: true
        run: |
          python3 tools/summarize_reports.py \
            --review-json review.json \
            --execution-json execution-report.json \
            --functional-json functional-run.json \
            --report deterministic-summary.md \
            --json-report deterministic-summary.json

      - name: 요약 결과 존재 보장
        if: always()
        shell: bash
        run: |
          if [ ! -s deterministic-summary.md ]; then
            {
              echo "# DAOUTECH_IDC 결정적 검수 요약"
              echo ""
              echo "> tools/summarize_reports.py 실행 중 요약 파일 생성 자체가 실패했습니다."
            } > deterministic-summary.md
          fi
          if [ ! -s deterministic-summary.json ]; then
            printf '%s\n' '{"status":"BLOCKED","summary_engine":"local-deterministic-python","external_ai_required":false,"message":"결정적 요약 JSON 미생성"}' > deterministic-summary.json
          fi

      - name: GitHub Actions 요약 화면 작성
        if: always()
        shell: bash
        run: |
          {
            echo "# DAOUTECH_IDC 제출 검수"
            echo ""
            echo "- 실행 이벤트: **${{ github.event_name }}**"
            echo "- 저장소 품질 검수: **${{ steps.review.outcome }}**"
            echo "- 전체 파일 실행·제출 분석: **${{ steps.execution.outcome }}**"
            echo "- functional 실제 수행: **${{ steps.functional.outcome }}**"
            echo "- 결정적 요약: **${{ steps.summary.outcome }}**"
            echo "- 외부 AI 의존성: **없음**"
            echo "- Node: **$(node --version 2>/dev/null || echo unavailable)**"
            echo "- Python: **$(python3 --version 2>/dev/null || echo unavailable)**"
            echo ""
            cat deterministic-summary.md
            echo ""
            echo "---"
            echo ""
            cat review.md
            echo ""
            echo "---"
            echo ""
            cat execution-report.md
            echo ""
            echo "---"
            echo ""
            cat functional-run.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 제출 검수 및 실행 리포트 보관
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: submission-review-${{ github.run_number }}
          path: |
            deterministic-summary.md
            deterministic-summary.json
            review.md
            review.json
            execution-report.md
            execution-report.json
            functional-run.md
            functional-run.json
            functional-logs/
            portfolio-manifest.json
            SUBMISSION.md
            .github/dependabot.yml
          retention-days: 14
          if-no-files-found: error

      - name: 최종 제출 판정
        if: >-
          always() &&
          (steps.review.outcome == 'failure' ||
           steps.execution.outcome == 'failure' ||
           steps.functional.outcome == 'failure' ||
           steps.summary.outcome == 'failure')
        shell: bash
        run: |
          if [ "${{ steps.review.outcome }}" = "failure" ]; then
            echo "::error::저장소 품질 검수에서 ERROR가 발견되었습니다. review.md를 확인하십시오."
          fi
          if [ "${{ steps.execution.outcome }}" = "failure" ]; then
            echo "::error::전체 파일 실행·제출 분석에서 문제가 발견되었습니다. execution-report.md를 확인하십시오."
          fi
          if [ "${{ steps.functional.outcome }}" = "failure" ]; then
            echo "::error::실행 가능한 전체 파일 functional 수행에서 문제가 발견되었습니다. functional-run.md를 확인하십시오."
          fi
          if [ "${{ steps.summary.outcome }}" = "failure" ]; then
            echo "::error::결정적 요약 판정이 BLOCKED이거나 요약 생성에 실패했습니다. deterministic-summary.md를 확인하십시오."
          fi
          exit 1

name: 저장소 제출 검수 및 결정적 요약

# 저장소의 사실 판정과 제출 준비도는 외부 AI 없이 Python 검사기가 결정적으로 수행합니다.
# Dependabot PR에서도 동일한 검사가 실행되며, 매주 정기 검수도 수행합니다.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # 매주 월요일 09:30 KST (00:30 UTC)
    - cron: '30 0 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-review:
    name: 전체 파일 검수·실행 분석·제출 판정
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v6

      - name: Python 3.12 준비
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Node 24 준비
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: 런타임 버전 확인
        run: |
          set -euo pipefail
          python3 --version
          node --version

      - name: 결정적 저장소 품질 검수
        id: review
        continue-on-error: true
        run: |
          python3 tools/review_repo.py \
            --report review.md \
            --json-report review.json

      - name: 전체 파일 안전 실행 및 제출 준비도 분석
        id: execution
        continue-on-error: true
        run: |
          python3 tools/run_analyze.py \
            --manifest portfolio-manifest.json \
            --report execution-report.md \
            --json-report execution-report.json

      - name: 실행 가능한 전체 파일 functional 수행
        id: functional
        continue-on-error: true
        run: |
          python3 tools/execute_repo.py \
            --target all \
            --mode functional \
            --report functional-run.md \
            --json-report functional-run.json \
            --log-dir functional-logs

      - name: 운영 시나리오 회귀 검증
        id: scenarios
        continue-on-error: true
        run: |
          python3 scenario_runner.py scenarios \
            --report scenario-report.md \
            --json-report scenario-report.json

      - name: 면접 대비 전체 기능 Lifecycle 검증
        id: lifecycle
        continue-on-error: true
        run: |
          python3 tools/portfolio_manager.py \
            --manifest portfolio-manifest.json \
            --catalog feature-catalog.json \
            --readiness-report interview-readiness.md \
            --json-report interview-readiness.json \
            --inventory-report feature-inventory.md \
            --upgrade-report upgrade-plan.md \
            --fail-on-blocked

      - name: 리포트 존재 보장
        if: always()
        shell: bash
        run: |
          if [ ! -s review.md ]; then
            { echo "# 저장소 자동 검수 리포트"; echo ""; echo "> review 리포트 생성 실패"; } > review.md
          fi
          if [ ! -s review.json ]; then
            printf '%s\n' '{"files": [], "issues": [{"severity": "ERROR", "path": "tools/review_repo.py", "message": "JSON 리포트 미생성"}]}' > review.json
          fi
          if [ ! -s execution-report.md ]; then
            { echo "# 제출 실행·분석 리포트"; echo ""; echo "> execution 리포트 생성 실패"; } > execution-report.md
          fi
          if [ ! -s execution-report.json ]; then
            printf '%s\n' '{"files": [], "submission_checks": [{"status": "ERROR", "item": "tools/run_analyze.py", "message": "JSON 리포트 미생성"}]}' > execution-report.json
          fi
          if [ ! -s functional-run.md ]; then
            { echo "# 저장소 functional 실행 결과"; echo ""; echo "> functional 리포트 생성 실패"; } > functional-run.md
          fi
          if [ ! -s functional-run.json ]; then
            printf '%s\n' '{"status":"FAIL","records":[],"message":"functional JSON 리포트 미생성"}' > functional-run.json
          fi
          if [ ! -s scenario-report.md ]; then
            { echo "# IDC 운영 시나리오 검증"; echo ""; echo "> scenario 리포트 생성 실패"; } > scenario-report.md
          fi
          if [ ! -s scenario-report.json ]; then
            printf '%s\n' '{"status":"FAIL","count":0,"results":[],"message":"scenario JSON 리포트 미생성"}' > scenario-report.json
          fi
          if [ ! -s interview-readiness.md ]; then
            { echo "# 면접 대비 Lifecycle 리포트"; echo ""; echo "> lifecycle 리포트 생성 실패"; } > interview-readiness.md
          fi
          if [ ! -s interview-readiness.json ]; then
            printf '%s\n' '{"status":"BLOCKED","score":0,"blockers":["lifecycle JSON 리포트 미생성"]}' > interview-readiness.json
          fi
          if [ ! -s feature-inventory.md ]; then
            echo '# 전체 기능 인벤토리' > feature-inventory.md
          fi
          if [ ! -s upgrade-plan.md ]; then
            echo '# 업그레이드·출시 관리 계획' > upgrade-plan.md
          fi

      - name: 로컬 결정적 요약 생성
        id: summary
        continue-on-error: true
        run: |
          python3 tools/summarize_reports.py \
            --review-json review.json \
            --execution-json execution-report.json \
            --functional-json functional-run.json \
            --report deterministic-summary.md \
            --json-report deterministic-summary.json

      - name: 통합 HTML 품질 리포트 생성
        id: htmlreport
        continue-on-error: true
        run: |
          python3 tools/portfolio_report.py \
            --review review.json \
            --execution execution-report.json \
            --functional functional-run.json \
            --summary deterministic-summary.json \
            --scenarios scenario-report.json \
            --output portfolio-report.html

      - name: 요약 결과 존재 보장
        if: always()
        shell: bash
        run: |
          if [ ! -s deterministic-summary.md ]; then
            { echo "# DAOUTECH_IDC 결정적 검수 요약"; echo ""; echo "> 결정적 요약 생성 실패"; } > deterministic-summary.md
          fi
          if [ ! -s deterministic-summary.json ]; then
            printf '%s\n' '{"status":"BLOCKED","summary_engine":"local-deterministic-python","external_ai_required":false}' > deterministic-summary.json
          fi
          if [ ! -s portfolio-report.html ]; then
            printf '%s\n' '<!doctype html><meta charset="utf-8"><h1>Portfolio report generation failed</h1>' > portfolio-report.html
          fi

      - name: GitHub Actions 요약 화면 작성
        if: always()
        shell: bash
        run: |
          {
            echo "# DAOUTECH_IDC 제출·면접 준비 검수"
            echo ""
            echo "- 실행 이벤트: **${{ github.event_name }}**"
            echo "- 저장소 품질 검수: **${{ steps.review.outcome }}**"
            echo "- 전체 파일 실행·제출 분석: **${{ steps.execution.outcome }}**"
            echo "- functional 실제 수행: **${{ steps.functional.outcome }}**"
            echo "- 운영 시나리오: **${{ steps.scenarios.outcome }}**"
            echo "- 면접 Lifecycle: **${{ steps.lifecycle.outcome }}**"
            echo "- 결정적 요약: **${{ steps.summary.outcome }}**"
            echo "- 통합 HTML 리포트: **${{ steps.htmlreport.outcome }}**"
            echo "- 외부 AI 의존성: **없음**"
            echo "- Node: **$(node --version 2>/dev/null || echo unavailable)**"
            echo "- Python: **$(python3 --version 2>/dev/null || echo unavailable)**"
            echo ""
            cat interview-readiness.md
            echo ""
            echo "---"
            echo ""
            cat deterministic-summary.md
            echo ""
            echo "---"
            echo ""
            cat scenario-report.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 제출 검수 및 실행 리포트 보관
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: submission-review-${{ github.run_number }}
          path: |
            deterministic-summary.md
            deterministic-summary.json
            review.md
            review.json
            execution-report.md
            execution-report.json
            functional-run.md
            functional-run.json
            functional-logs/
            scenario-report.md
            scenario-report.json
            interview-readiness.md
            interview-readiness.json
            feature-inventory.md
            upgrade-plan.md
            portfolio-report.html
            portfolio-manifest.json
            feature-catalog.json
            docs/INTERVIEW_GUIDE.md
            docs/FEATURE_LIFECYCLE.md
            SUBMISSION.md
            .github/dependabot.yml
          retention-days: 30
          if-no-files-found: error
          include-hidden-files: true

      - name: 최종 제출 판정
        if: >-
          always() &&
          (steps.review.outcome == 'failure' ||
           steps.execution.outcome == 'failure' ||
           steps.functional.outcome == 'failure' ||
           steps.scenarios.outcome == 'failure' ||
           steps.lifecycle.outcome == 'failure' ||
           steps.summary.outcome == 'failure' ||
           steps.htmlreport.outcome == 'failure')
        shell: bash
        run: |
          echo "::error::제출·면접 준비 검증 단계 중 하나 이상이 실패했습니다. Artifact와 Step Summary를 확인하십시오."
          exit 1
